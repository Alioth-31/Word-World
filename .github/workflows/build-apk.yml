name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Test application
        run: npm test
      - name: Verify bundled vocabulary and build FSRS
        run: npm run build
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Initialize and sync Android
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor "#14272e" --splashBackgroundColor "#14272e"
      - name: Compile APK
        run: cd android && bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: word-world-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
